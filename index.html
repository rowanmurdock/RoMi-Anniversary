<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../image/favicon.png">

    <meta charset="UTF-8">
  <title>Enter Password</title>
  <style>
    body {
      background-image: url("image/back1.png");
      background-size: cover;
      image-rendering: pixelated;

      margin: 0;
      
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Pixelify Sans", sans-serif;
    }

    .window {
      background: #f4f4f4;
      border: 3px solid #000;
      width: 300px;
      padding: 0;
      box-shadow: 0px 0px 0px 4px #c0c0c0; 
    }

    .titlebar {
      background: #000080;
      color: white;
      padding: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    
    .picturebar {
      display: flex;
      align-items: center;
      color: white;
      padding: 0px;
      justify-content: space-evenly;
    }

    .content {
      padding: 15px;
    }

    input {
      width: 100%;
      padding: 2px;
      margin-top: 10px;
      border: 2px solid #000;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: 2px solid #000;
      background: #d9d9d9;
      font-family: inherit;
      cursor: pointer;
    }

    button:active {
      background: #b5b5b5;
    }

    
.typewriter p {
  overflow: hidden;
  white-space: nowrap;
  margin: 0;
  letter-spacing: .15em;
  width: 0;


  animation: typing 3s steps(40, end) forwards, blink-caret .75s step-end infinite;
}


.typewriter p:nth-child(1) {
  animation-delay: 0s;
}

.typewriter p:nth-child(2) {
  animation-delay: 3s;
}

.typewriter p:nth-child(3) {
  animation-delay: 6s;
}

.typewriter p:nth-child(4) {
  animation-delay: 9s;
}

.typewriter p:nth-child(5) {
  animation-delay: 12s;
}

.typewriter p:nth-child(6) {
  animation-delay: 15s;
}


@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

 @keyframes float {
    0% { transform: translate(0, 0px); }
    10% {transform: translate(0, 1px);}
    20% {transform: translate(0, 3px);}
    30% {transform: translate(0, 6px);}
    40% { transform: translate(0, 9px); }
    50% { transform: translate(0, 10px); }
    60% { transform: translate(0, 9px); }
    70% { transform: translate(0, 6px); }
    80% { transform: translate(0, 3px); }
    90% { transform: translate(0, 1px); }
    100% { transform: translate(0, 0px);}
    }

    .float{
        animation: float 2s ease infinite;
    }


  </style>
</head>
<body>

  <div class="window float">
    <div class="titlebar">Password Required</div>
    <div class="content typewriter">
      <p>The site's password is our favorite animal with</p>
      <p>just the numbers of our anniversary date :3</p>
      <div class="picturebar"><img src="https://png.pngtree.com/png-vector/20250416/ourmid/pngtree-a-cute-pixel-art-illustration-of-smiling-white-paint-with-transparent-vector-png-image_15998177.png" width=70>
      <img src="https://png.pngtree.com/png-vector/20250416/ourmid/pngtree-a-cute-pixel-art-illustration-of-smiling-white-paint-with-transparent-vector-png-image_15998177.png" width=70>
      <img src="https://png.pngtree.com/png-vector/20250416/ourmid/pngtree-a-cute-pixel-art-illustration-of-smiling-white-paint-with-transparent-vector-png-image_15998177.png" width=70>
      </div>
      <input id="pw" type="password">
      <button onclick="check()">Continue</button>
    </div>
  </div>

  <script>
    function check() {
      const input = document.getElementById("pw").value;
      const correct = "cat12112022";

      if (input === correct) {
        window.location.href = "html/home.html";
      } else {
        alert("Incorrect password... The animal is currently on the screen and the numbers should look like this: 11111111");
      }
    }
  </script>

</body>
</html>
